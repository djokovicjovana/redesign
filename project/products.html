<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Jovana Đoković</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="scrollable">

  <header class="inner-header">
    <div class="inner-branding">
      <a href="index.html" class="inner-title">Jovana Đoković</a>
      <span class="inner-subtitle">Photographer</span>
    </div>
    <nav class="inner-nav">
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="portraits.html">Portraits</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="products.html" class="active">Products</a></li>
        <li><a href="booking.html">Booking</a></li>
      </ul>
    </nav>
  </header>

  <main class="products-page">

    <section class="products-hero">
      <h1 class="products-hero-title">Where aesthetics meet function.</h1>
      <p class="products-hero-sub">Product photography shaped by light, shadow, and structure. Designed to elevate the
        visual identity of the design.</p>
      <div class="products-divider-wrap">
        <div class="products-divider"></div>
      </div>
    </section>

    <section class="products-showcase-section">
      <div class="products-showcase-container">

        <div class="products-main-display">
          <button class="products-nav-arrow prev-arrow" id="prevArrow" aria-label="Previous image">&#8592;</button>

          <div class="products-main-frame" id="mainFrame">
            <img id="mainDisplayImg" src="product/1.jpg" alt="Product Showcase">
          </div>

          <button class="products-nav-arrow next-arrow" id="nextArrow" aria-label="Next image">&#8594;</button>
        </div>

        <div class="products-meta-bar">
          <span class="products-meta-counter" id="metaCounter">01 / 11</span>
        </div>

        <div class="products-thumb-strip" id="thumbStrip">
          <button class="products-thumb-btn active" data-src="product/1.jpg" data-index="0" aria-label="Select photo 1">
            <img src="product/1.jpg" alt="Thumbnail 1">
          </button>
          <button class="products-thumb-btn" data-src="product/2.jpg" data-index="1" aria-label="Select photo 2">
            <img src="product/2.jpg" alt="Thumbnail 2">
          </button>
          <button class="products-thumb-btn" data-src="product/3.jpg" data-index="2" aria-label="Select photo 3">
            <img src="product/3.jpg" alt="Thumbnail 3">
          </button>
          <button class="products-thumb-btn" data-src="product/4.jpg" data-index="3" aria-label="Select photo 4">
            <img src="product/4.jpg" alt="Thumbnail 4">
          </button>
          <button class="products-thumb-btn" data-src="product/5.jpg" data-index="4" aria-label="Select photo 5">
            <img src="product/5.jpg" alt="Thumbnail 5">
          </button>
          <button class="products-thumb-btn" data-src="product/6.jpg" data-index="5" aria-label="Select photo 6">
            <img src="product/6.jpg" alt="Thumbnail 6">
          </button>
          <button class="products-thumb-btn" data-src="product/7.jpg" data-index="6" aria-label="Select photo 7">
            <img src="product/7.jpg" alt="Thumbnail 7">
          </button>
          <button class="products-thumb-btn" data-src="product/8.jpg" data-index="7" aria-label="Select photo 8">
            <img src="product/8.jpg" alt="Thumbnail 8">
          </button>
          <button class="products-thumb-btn" data-src="product/9.jpg" data-index="8" aria-label="Select photo 9">
            <img src="product/9.jpg" alt="Thumbnail 9">
          </button>
          <button class="products-thumb-btn" data-src="product/10.jpg" data-index="9" aria-label="Select photo 10">
            <img src="product/10.jpg" alt="Thumbnail 10">
          </button>
          <button class="products-thumb-btn" data-src="product/11.jpg" data-index="10" aria-label="Select photo 11">
            <img src="product/11.jpg" alt="Thumbnail 11">
          </button>
        </div>

      </div>
    </section>

  </main>

  <div id="productsLightbox" class="anja-lightbox" aria-hidden="true">
    <div class="anja-lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="anja-lightbox-dialog">
      <button type="button" class="anja-lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
      <button type="button" class="anja-lightbox-nav anja-lightbox-prev" id="lightboxPrev"
        aria-label="Previous image">&larr;</button>
      <div class="anja-lightbox-media">
        <img id="lightboxImg" src="" alt="Expanded Product Photo">
      </div>
      <button type="button" class="anja-lightbox-nav anja-lightbox-next" id="lightboxNext"
        aria-label="Next image">&rarr;</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var mainImg = document.getElementById("mainDisplayImg");
      var mainFrame = document.getElementById("mainFrame");
      var thumbBtns = document.querySelectorAll(".products-thumb-btn");
      var counter = document.getElementById("metaCounter");
      var prevBtn = document.getElementById("prevArrow");
      var nextBtn = document.getElementById("nextArrow");

      var lightbox = document.getElementById("productsLightbox");
      var lightboxImg = document.getElementById("lightboxImg");
      var lightboxBackdrop = document.getElementById("lightboxBackdrop");
      var lightboxClose = document.getElementById("lightboxClose");
      var lightboxPrev = document.getElementById("lightboxPrev");
      var lightboxNext = document.getElementById("lightboxNext");

      var currentIndex = 0;
      var total = thumbBtns.length;

      function formatNumber(num) {
        return num < 10 ? "0" + num : num;
      }

      function updateActiveImage(index) {
        if (index < 0) {
          currentIndex = total - 1;
        } else if (index >= total) {
          currentIndex = 0;
        } else {
          currentIndex = index;
        }

        var activeBtn = thumbBtns[currentIndex];
        var newSrc = activeBtn.getAttribute("data-src");

        mainImg.style.opacity = "0";
        setTimeout(function () {
          mainImg.src = newSrc;
          mainImg.style.opacity = "1";
        }, 180);

        thumbBtns.forEach(function (btn, i) {
          if (i === currentIndex) {
            btn.classList.add("active");
            btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
          } else {
            btn.classList.remove("active");
          }
        });

        if (counter) {
          counter.textContent = formatNumber(currentIndex + 1) + " / " + formatNumber(total);
        }

        if (lightbox && lightbox.classList.contains("active")) {
          lightboxImg.src = newSrc;
        }
      }

      function openLightbox(index) {
        updateActiveImage(index);
        lightbox.classList.add("active");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        if (!lightbox) return;
        lightbox.classList.remove("active");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      thumbBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var idx = parseInt(this.getAttribute("data-index"), 10);
          updateActiveImage(idx);
        });
      });

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          updateActiveImage(currentIndex - 1);
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          updateActiveImage(currentIndex + 1);
        });
      }

      if (mainFrame) {
        mainFrame.addEventListener("click", function () {
          openLightbox(currentIndex);
        });
      }

      if (lightboxClose) lightboxClose.addEventListener("click", closeLightbox);
      if (lightboxBackdrop) lightboxBackdrop.addEventListener("click", closeLightbox);
      if (lightboxPrev) {
        lightboxPrev.addEventListener("click", function () {
          updateActiveImage(currentIndex - 1);
        });
      }
      if (lightboxNext) {
        lightboxNext.addEventListener("click", function () {
          updateActiveImage(currentIndex + 1);
        });
      }

      document.addEventListener("keydown", function (e) {
        if (lightbox && lightbox.classList.contains("active")) {
          if (e.key === "Escape") closeLightbox();
          if (e.key === "ArrowLeft") updateActiveImage(currentIndex - 1);
          if (e.key === "ArrowRight") updateActiveImage(currentIndex + 1);
        } else {
          if (e.key === "ArrowLeft") updateActiveImage(currentIndex - 1);
          if (e.key === "ArrowRight") updateActiveImage(currentIndex + 1);
        }
      });
    });
  </script>
</body>

</html>
